name: Build and test MacPilot
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: macpilot-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test utility workflows
        run: swift test
      - name: Build app bundle
        run: bash build.sh
      - name: Verify bundle signature
        run: codesign --verify --deep --strict build/MacPilot.app
      - run: ditto -c -k --keepParent build/MacPilot.app MacPilot-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacPilot-preview
          path: MacPilot-app.zip
