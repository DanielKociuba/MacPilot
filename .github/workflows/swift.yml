   name: Build MacPilot
   on:
     push:
     workflow_dispatch:
   jobs:
     build:
       runs-on: macos-latest
       steps:
         - uses: actions/checkout@v4
         - run: bash build.sh
         - run: ditto -c -k --keepParent build/MacPilot.app MacPilot-app.zip
         - uses: actions/upload-artifact@v4
           with:
             name: MacPilot-app
             path: MacPilot-app.zip
